₹₹₹; Campus Mithra - ESP32 display + speaker node (PlatformIO / VS Code)
;
; The ESP32 shows the question and answer on the TFT and plays the spoken
; answer through the PAM8403. The PC does everything else: it listens on the
; earphone mic (Ctrl+Alt+4), runs Sarvam speech-to-text and Gemma, and sends the
; text and the audio down the USB cable.
;
;   pio run -t upload        build and flash (COM9)
;   pio device monitor       watch it (close this before running pc_client.py)

[platformio]
default_envs = mithra_ili9341

; --- Windows build workarounds (from the working "campus test" project) -----
;
; This project's path contains spaces ("Pavan Kumar H"). With TFT_eSPI in the
; build, a compile command passes 32,000 characters, SCons spills it into a
; response file, and xtensa GCC misreads the spaces and backslashes in it,
; failing with the misleading "CreateProcess: No such file or directory".
; So build artefacts go to a path with no spaces, the toolchain is reached
; through the C:\pio junction (same files as %USERPROFILE%\.platformio), and
; scripts/long_cmdline_win.py escapes response-file paths properly.
; Recreate the junction if it is ever missing:
;   New-Item -ItemType Junction -Path C:\pio -Target "$env:USERPROFILE\.platformio"
build_dir   = C:/pio-build/campusmithra
libdeps_dir = C:/pio-build/campusmithra/libdeps
core_dir    = C:/pio


[common]
; espressif32 6.x = Arduino-ESP32 2.0.17 / ESP-IDF 4.4. Same as the other ESP32
; projects on this machine, so the installed platform is reused, not downloaded.
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

upload_port     = COM9
monitor_port    = COM9
upload_speed    = 921600
; Must match SERIAL_BAUD in include/config.h and BAUD in pc_client.py. 460800
; gives ~46 KB/s, nearly six times the 8 KB/s the speech audio needs, so the
; speaker never starves. The CP2102 on this board already flashes reliably at
; 921600, so half that is comfortably safe.
monitor_speed   = 460800
monitor_filters = esp32_exception_decoder

build_flags = -D CORE_DEBUG_LEVEL=1


; Inherited by every [env:*] automatically, so no build can skip the fix.
[env]
extra_scripts = pre:scripts/long_cmdline_win.py


; --- TFT_eSPI configuration -------------------------------------------------
; Configured entirely through build flags; USER_SETUP_LOADED makes the library
; ignore its own User_Setup.h, so a library update cannot silently undo this.
;
; These are the pins already working on this board (unchanged from the
; espbluetoothspeaker and campus test projects). Do not rewire.
[tft_common]
build_flags =
    -D USER_SETUP_LOADED=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=5000000
lib_deps = bodmer/TFT_eSPI@^2.5.43


; Default - ILI9341 panel.
[env:mithra_ili9341]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
upload_port     = ${common.upload_port}
monitor_port    = ${common.monitor_port}
upload_speed    = ${common.upload_speed}
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps        = ${tft_common.lib_deps}
build_flags =
    ${common.build_flags}
    ${tft_common.build_flags}
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320


; Fallback - ST7789 panel. Use if the screen stays blank, garbled or
; colour-swapped with the default. Changes the driver, never the wiring.
;   pio run -e mithra_st7789 -t upload
[env:mithra_st7789]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
upload_port     = ${common.upload_port}
monitor_port    = ${common.monitor_port}
upload_speed    = ${common.upload_speed}
monitor_speed   = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps        = ${tft_common.lib_deps}
build_flags =
    ${common.build_flags}
    ${tft_common.build_flags}
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR

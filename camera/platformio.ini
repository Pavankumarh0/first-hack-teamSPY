; Campus Mithra - camera node (second ESP32 DevKit V1 + OV7670, no FIFO)
;
; The same sketch also opens in Arduino IDE: camera/campus_mithra_cam/.
; This file only lets it be built and flashed from VS Code / the command line.
;
;   pio run                   build
;   pio run -t upload         flash - ONLY after setting upload_port below
;   pio device monitor        watch the camera's serial log
;
; This is a separate project from the kiosk (../firmware). Nothing here
; changes or flashes the kiosk board.

[platformio]
src_dir     = campus_mithra_cam
default_envs = camera

; Same Windows workarounds as the kiosk project: this path contains spaces.
build_dir   = C:/pio-build/campusmithra-cam
libdeps_dir = C:/pio-build/campusmithra-cam/libdeps
core_dir    = C:/pio

[env:camera]
; espressif32 6.x = Arduino-ESP32 2.0.17, which ships the esp32-camera driver
; with OV7670 support compiled in - no extra library to install.
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

; The CAMERA board's port. Left empty on purpose: set it once you can see
; which COM port the camera ESP32 appears on. COM9 is the kiosk and is refused.
upload_port  =
monitor_port =
upload_speed  = 921600
monitor_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags = -D CORE_DEBUG_LEVEL=1

extra_scripts =
    pre:scripts/long_cmdline_win.py
    pre:scripts/guard_port.py
